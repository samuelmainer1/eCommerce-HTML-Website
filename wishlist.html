<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wishlist | BigDrop Kenya</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-header"></div>
  <main class="container">
    <h1 style="margin-bottom:20px;">My Wishlist</h1>
    <div class="product-grid" id="wishlist-products"></div>
  </main>
  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/app.js"></script>
  <script>
    const ids = getWishlist();
    const products = ids.map(id => getProductById(id)).filter(p => p && p.status === 'approved');
    if (!products.length) {
      document.getElementById('wishlist-products').innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><div class="icon">♡</div><p>Your wishlist is empty.</p><a href="index.html" class="btn btn-accent" style="margin-top:12px;display:inline-block;">Continue Shopping</a></div>';
    } else {
      renderProducts('wishlist-products', products);
    }
  </script>
  <script src="js/header.js"></script>
  <script src="js/footer.js"></script>
</body>
</html>
