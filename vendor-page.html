<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendor | BigDrop Kenya</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-header"></div>
  <main class="container">
    <div id="vendor-header" style="background:#fff; padding:24px; border-radius:10px; margin-bottom:24px; box-shadow:0 2px 8px rgba(0,0,0,0.06);"></div>
    <h2 style="margin-bottom:16px;">Products from this seller</h2>
    <div class="product-grid" id="vendor-products"></div>
  </main>
  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/app.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get('id');
    const vendor = getVendorById(id);
    if (!vendor) {
      document.getElementById('vendor-header').innerHTML = '<p>Vendor not found. <a href="index.html">Go home</a></p>';
    } else {
      document.title = vendor.shopName + ' | BigDrop Kenya';
      document.getElementById('vendor-header').innerHTML = '<h1 style="margin-bottom:8px;">' + vendor.shopName + '</h1><p style="color:#666;">Seller: ' + vendor.name + ' · Joined ' + vendor.joined + ' · Status: ' + vendor.status + '</p>';
      const products = getApprovedProducts().filter(p => p.vendorId === id);
      renderProducts('vendor-products', products);
    }
  </script>
  <script src="js/header.js"></script>
  <script src="js/footer.js"></script>
</body>
</html>
