<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article | BigDrop Kenya</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .post-hero { width: 100%; max-height: 360px; object-fit: cover; border-radius: 12px; margin-bottom: 24px; }
    .post-body { max-width: 720px; margin: 0 auto; line-height: 1.8; color: #333; }
    .post-body h1 { font-size: 1.75rem; margin-bottom: 10px; }
    .post-meta { color: #888; font-size: 0.9rem; margin-bottom: 20px; }
    .post-body p { margin-bottom: 14px; }
  </style>
</head>
<body>
  <div id="site-header"></div>
  <main class="container" style="padding-bottom:48px;">
    <div id="post"></div>
  </main>
  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/blog-data.js"></script>
  <script src="js/header.js"></script>
  <script src="js/footer.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get('id');
    let p = typeof getBlogPost === 'function' ? getBlogPost(id) : null;
    if (!p && typeof getBlogPosts === 'function') {
      p = getBlogPosts().find(function(x){ return String(x.id) === String(id); });
    }
    if (!p) {
      document.getElementById('post').innerHTML = '<p>Article not found. <a href="blog.html">Back to blog</a></p>';
    } else {
      document.title = p.title + ' | BigDrop Kenya';
      var body = p.body || ('<p>' + (p.content || p.summary || '').replace(/\n/g, '</p><p>') + '</p>');
      document.getElementById('post').innerHTML =
        (p.image ? '<img class="post-hero" src="' + p.image + '" alt="">' : '') +
        '<div class="post-body">' +
          '<div class="post-meta">' + (p.category || 'News') + ' · ' + (p.date || '') + '</div>' +
          '<h1>' + p.title + '</h1>' +
          body +
          '<p style="margin-top:28px;"><a href="blog.html" class="btn btn-outline">← More articles</a></p>' +
        '</div>';
    }
  </script>
</body>
</html>
