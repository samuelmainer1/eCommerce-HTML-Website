<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compare Products | BigDrop Kenya</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-header"></div>
  <main class="container">
    <h1 style="margin-bottom:20px;">Compare products</h1>
    <div id="compare-content"></div>
  </main>
  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/features.js"></script>
    <script src="js/app.js"></script>
  <script src="js/header.js"></script>
  <script src="js/polish.js"></script>
  <script src="js/footer.js"></script>
  <script>
    const ids = getCompareList();
    const products = ids.map(id => getProductById(id)).filter(Boolean);
    const el = document.getElementById('compare-content');
    if (products.length < 2) {
      el.innerHTML = '<div class="empty-state"><p>Select at least 2 products to compare (max 3).</p><a href="index.html" class="btn btn-accent" style="margin-top:12px;display:inline-block;">Browse products</a></div>';
    } else {
      let head = '<tr><th>Feature</th>';
      products.forEach(p => { head += '<th><img src="' + p.image + '" alt=""><div style="margin-top:8px;font-size:0.9rem;">' + p.title + '</div></th>'; });
      head += '</tr>';
      const rows = [
        ['Price', products.map(p => formatPrice(p.price))],
        ['Old price', products.map(p => p.oldPrice ? formatPrice(p.oldPrice) : '—')],
        ['Rating', products.map(p => '★ ' + (p.rating || 4) + ' (' + (p.reviews || 0) + ')')],
        ['Category', products.map(p => p.category)],
        ['Stock', products.map(p => p.stock > 0 ? p.stock + ' available' : 'Out of stock')],
        ['Seller', products.map(p => { const v = getVendorById(p.vendorId); return v ? v.shopName : 'BigDrop'; })],
        ['', products.map(p => '<button class="btn btn-sm btn-accent" onclick="addToCart(\\'' + p.id + '\\'); showToast(\\'Added!\\',\\'success\\');">Add to Cart</button> <button class="btn btn-sm btn-outline" onclick="toggleCompare(\\'' + p.id + '\\'); location.reload();">Remove</button>')]
      ];
      let body = rows.map(r => '<tr><td><strong>' + r[0] + '</strong></td>' + r[1].map(c => '<td>' + c + '</td>').join('') + '</tr>').join('');
      el.innerHTML = '<div style="overflow-x:auto;"><table class="compare-table"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>';
    }
  </script>
</body>
</html>
